services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opengenui
      POSTGRES_PASSWORD: opengenui
      POSTGRES_DB: opengenui
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opengenui']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis_data:/data']
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: opengenui
      MINIO_ROOT_PASSWORD: opengenui-local-storage
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: ['media_data:/data']
volumes:
  postgres_data:
  redis_data:
  media_data:
